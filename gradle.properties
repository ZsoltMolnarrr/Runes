# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Game
minecraft_version = 1.21.11
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=1.21.11     multiple: minecraft_compat_versions=1.21:1.21.1
minecraft_compat_versions=1.21.11

# Loader
fabric_loader_version = 0.19.3
neoforge_version = 21.11.45

# Mod
mod_version=1.3.2.003
maven_group=net.rpg_series
archives_name=runes
enabled_platforms = fabric,neoforge

# Dependencies
fabric_api_version = 0.141.6+1.21.11

# Bundle API (rune pouches) — upstream has NO 1.21.11 build on Modrinth; we consume our own
# port (Foundations/BundleAPI, branch 1.21.11) from mavenLocal as `com.github.TheRedBrain:bundle-api-<platform>`.
# Gated: when false, `RunePouches` is excluded from compilation and the JiJ dep is not declared.
enable_bundle_api=true
bundle_api_version=1.1.1.004+1.21.11

# EMI (optional recipe-viewer integration) — NO 1.21.11 build exists (latest 1.1.24+1.21.1).
# Gated: when false, `net.runes.compat.emi` is excluded from compilation and no EMI dep is declared.
# When re-enabling, also restore the `emi` entrypoint in fabric.mod.json.
enable_emi=false
emi_version=1.1.24+1.21.1
