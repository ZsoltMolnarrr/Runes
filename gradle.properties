# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Game
minecraft_version = 26.2
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.1:26.1.1:26.1.2     multiple: minecraft_compat_versions=1.21:1.21.1
minecraft_compat_versions=26.2

# Loader
fabric_loader_version = 0.19.3
neoforge_version = 26.2.0.75

# Mod
mod_version=1.3.2.001
maven_group=net.rpg_series
archives_name=runes
enabled_platforms = fabric,neoforge

# Dependencies
fabric_api_version = 0.159.0+26.2

# Bundle API (rune pouches) — upstream has NO 26.x build on Modrinth; we consume our own
# port (Foundations/BundleAPI, branch 26.2) from mavenLocal as `com.github.TheRedBrain:bundle-api-<platform>`.
# Gated: when false, `RunePouches` is excluded from compilation and the JiJ dep is not declared.
enable_bundle_api=true
bundle_api_version=1.1.1.001+26.2

# JEI (Just Enough Items) — recipe-viewer integration for the Rune Crafting Altar.
# The artifact id embeds the game version: `jei-<minecraft_version>-common-api`.
jei_version=30.30.0.204

# REI (Roughly Enough Items) — recipe-viewer integration for the Rune Crafting Altar.
# The plugin is compile-only in `common`; REI is never bundled and is not a required dependency.
rei_version=26.2.820

# EMI (optional recipe-viewer integration) — PARKED: EMI has never shipped past 1.21.1
# (latest 1.1.24+1.21.1), so there is nothing to compile against here. The plugin sources stay
# in-tree under `net/runes/compat/emi/` but are excluded from the compile unconditionally.
#
# To restore once EMI ships for this game version: uncomment the two properties below, then the
# EMI blocks in common/fabric/neoforge `build.gradle` (search for "EMI"), and re-add the `emi`
# entrypoint to fabric.mod.json:
#     "emi": [ "net.runes.compat.emi.RunesEmiPlugin" ]
#enable_emi=false
#emi_version=1.1.24+1.21.1
