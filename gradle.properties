# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Game
minecraft_version = 1.20.1
yarn_mappings = 1.20.1+build.1

# Loader
fabric_loader_version = 0.19.5
forge_version = 1.20.1-47.4.22

# Mod
mod_version=1.3.2.004
maven_group=net.rpg_series
archives_name=runes
enabled_platforms = fabric,forge

# Dependencies
fabric_api_version = 0.92.12+1.20.1
# mavenLocal coordinates: com.github.TheRedBrain:bundle-api-<platform>:<version>
bundle_api_version=1.1.0.001
# Optional integration — compile-only, plus dev-runtime so `runClient` can verify the plugin.
emi_version=1.1.15+1.20.1
# Forge 47 ships plain Mixin 0.8.5 without MixinExtras; other ecosystem mods on the classpath
# need it and 0.4.1 crashes Bootstrap on sponge-mixin 0.17 `@Redirect` arrays — never 0.4.1.
mixin_extras_version=0.5.5
