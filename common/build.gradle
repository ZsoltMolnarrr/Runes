architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'shedaniel'
        url = 'https://maven.shedaniel.me'
    }
    mavenLocal()
}

// Optional integrations — see gradle.properties for the gating rationale.
def bundleApiEnabled = rootProject.enable_bundle_api.toBoolean()
//def emiEnabled = rootProject.enable_emi.toBoolean()

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    if (bundleApiEnabled) {
        modImplementation "com.github.TheRedBrain:bundle-api-fabric:${project.bundle_api_version}"
    }

    // JEI (recipe viewer) — the `common-api-intermediary` artifact is the loader-neutral, intermediary-mapped
    // API (the plain `common-api` is Mojmap and would not compile here), so it goes through Loom to be
    // remapped into this module's Yarn namespace. Compile-only: only ever class-loaded by JEI itself.
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api-intermediary:${project.jei_version}"

    // REI (recipe viewer) — the loader-neutral `RoughlyEnoughItems-api` artifact is intermediary-mapped,
    // so it must go through Loom (`modCompileOnly`) to be remapped into this module's Yarn namespace.
    // Compile-only: these classes are only ever loaded by REI, so the mod runs fine without it.
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api:${project.rei_version}"

    // EMI (optional integration) — PARKED, no build past 1.21.1 (see gradle.properties).
    // The `xplat-intermediary` `api` artifact is the loader-neutral subset EMI publishes for
    // Architectury common modules. Compile-only: `net.runes.compat.emi` is only ever class-loaded
    // by EMI itself, so the mod runs fine without EMI present.
    //if (emiEnabled) {
    //    modCompileOnly "dev.emi:emi-xplat-intermediary:${project.emi_version}:api"
    //}
}

sourceSets.main.java {
    // Keep the integration code in-tree, but out of the compile when its dependency is unavailable.
    // Callers reach RunePouches only through the reflective `BundleApiCompat` bridge.
    if (!bundleApiEnabled) {
        exclude 'net/runes/crafting/RunePouches.java'
    }
    // EMI is parked (see gradle.properties): the plugin sources stay in-tree but never compile.
    // Restore the gate below when re-enabling.
    exclude 'net/runes/compat/emi/**'
    //if (!emiEnabled) {
    //    exclude 'net/runes/compat/emi/**'
    //}
}
