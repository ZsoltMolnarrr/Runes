architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for the common compile — `common` only needs the API surface, and the Fabric
// artifact of each library is the one Loom maps into named (Yarn) space for this module.
def platform = "fabric";

repositories {
    // Bundle API for 1.20.1 is vendored from the ZsoltMolnarrr/bundle-api fork (branch `1.20.1-modern`)
    // until upstream publishes a 1.20.1 build to Modrinth. See libs/maven/README.md for the exit path.
    maven {
        name = 'VendoredBundleApi'
        url = uri("${rootProject.projectDir}/libs/maven")
        content { includeGroup 'com.github.TheRedBrain' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // No Fabric API in common: there is no Forgified Fabric API on the 1.20.1 line, so loader API
    // usage (item groups, render layers) stays in the platform modules.

    // Bundle API, vendored under libs/maven.
    modImplementation("com.github.TheRedBrain:bundle-api-${platform}:${rootProject.bundle_api_version}")

    // EMI (optional integration) — the `xplat-intermediary` `api` artifact is the loader-neutral
    // subset EMI publishes for Architectury common modules. Compile-only: `net.runes.compat.emi`
    // is only ever class-loaded by EMI itself, so the mod runs fine without EMI present.
    modCompileOnly "dev.emi:emi-xplat-intermediary:${rootProject.emi_version}:api"
}
